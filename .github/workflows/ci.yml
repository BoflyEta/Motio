name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint & test (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # There are no runtime dependencies; this installs the dev toolchain only.
      - run: npm ci

      - name: Lint (type-check the public surface via JSDoc)
        run: npm run lint

      - name: Test
        run: npm test

      # Proves the published artifact still builds: .d.ts emit plus the bundle.
      - name: Build
        run: npm run build
